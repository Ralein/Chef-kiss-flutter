name: chefs_kiss
description: "Chef's Kiss — a personal, visual-first recipe book and calm cooking companion."
publish_to: 'none'
version: 0.0.1+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.0
  drift: ^2.24.2
  sqlite3: ^2.5.0
  sqlite3_flutter_libs: ^0.5.28
  path_provider: ^2.1.5
  path: ^1.9.0
  uuid: ^4.5.1
  intl: ^0.20.2
  crypto: ^3.0.6
  meta: ^1.15.0
  flutter_svg: ^2.0.17

  recipe_domain:
    path: packages/recipe_domain
  app_contracts:
    path: packages/app_contracts
  design_tokens:
    path: packages/design_tokens
  http: ^1.6.0
  image_picker: ^1.2.4
  flutter_secure_storage: ^11.2.0
  wakelock_plus: ^1.8.2
  http_parser: ^4.1.2
  cupertino_icons: ^2.0.0
  flutter_tts: ^4.2.5
  lucide_icons_flutter: 3.1.25
  url_launcher: ^6.3.3
  package_info_plus: ^10.2.2

dev_dependencies:
  test: ^1.25.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.15
  drift_dev: ^2.24.2

flutter:
  uses-material-design: true
  assets:
    - assets/seed/
    - assets/illustrations/
    - assets/fonts/DMSerifDisplay-OFL.txt
  # DM Serif Display (SIL Open Font License 1.1, see assets/fonts/DMSerifDisplay-OFL.txt):
  # book spines and journal headings.
  fonts:
    - family: DMSerifDisplay
      fonts:
        - asset: assets/fonts/DMSerifDisplay-Regular.ttf
        - asset: assets/fonts/DMSerifDisplay-Italic.ttf
          style: italic
