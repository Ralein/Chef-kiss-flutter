<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Chef’s Kiss — your recipe keepsake: cook step by step, scan meals for nutrition, and keep a food log.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Chef’s Kiss">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <meta name="theme-color" content="#C2552F">
  <title>Chef’s Kiss</title>
  <link rel="manifest" href="manifest.json">

  <!-- Launch screen: the app icon's cream disc on the app's canvas, as on
       Android and iOS, until Flutter draws its first frame. -->
  <style>
    html, body { margin: 0; height: 100%; background: #FAF7F2; }
    @media (prefers-color-scheme: dark) { html, body { background: #161412; } }
    #launch {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      transition: opacity 320ms ease-out; pointer-events: none;
    }
    #launch img { width: 144px; height: 144px; }
  </style>
</head>
<body>
  <div id="launch" aria-hidden="true"><img src="assets/assets/illustrations/splash_medallion.png" alt=""></div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var launch = document.getElementById('launch');
      if (!launch) return;
      launch.style.opacity = '0';
      setTimeout(function () { launch.remove(); }, 400);
    });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
